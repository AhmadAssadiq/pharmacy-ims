<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f7" />
    <title>Pharmacy Inventory Management System</title>
    <script>
      // Apply a stored theme and language before first paint, so a dark-theme
      // user never sees a flash of light and an Arabic user never sees the page
      // laid out left to right first. "system" stores nothing; the stylesheet's
      // prefers-color-scheme block handles it. See src/context/ThemeContext.jsx
      // and src/i18n/I18nContext.jsx, which keep these in step afterwards.
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem('pims_theme');
        if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('pims_lang');
        if (!lang) lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        if (lang === 'ar') {
          root.lang = 'ar';
          root.dir = 'rtl';
          var font = document.createElement('link');
          font.id = 'font-arabic';
          font.rel = 'stylesheet';
          font.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap';
          document.head.appendChild(font);
        }
      } catch (e) {}
    </script>
    <!-- Geist: the type system dealt with the achromatic-ledger app style. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23141414'/%3E%3Cpath d='M5 8h6M8 5v6' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3Cstyle%3E@media (prefers-color-scheme: dark) { rect { fill: %23ececee } path { stroke: %230f1012 } }%3C/style%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
